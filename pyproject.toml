[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cover-studio"
version = "0.1.0"
description = "Local bilingual RVC training and AI cover workstation"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20", "numpy>=2,<3", "scipy>=1.14,<2", "soundfile>=0.13,<1", "imageio-ffmpeg==0.6.0"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.28"]

[tool.setuptools.packages.find]
include = ["studio*"]

[tool.setuptools.package-data]
studio = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
